<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2Weeks homework</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>자기소개</h1>
  <div class="box1">
    <h2>기본 정보</h2>
    <p>이름: 박시현</p>
    <p>나이: 21세</p>
    <p>학교: 상명대학교 디자인학부 커뮤니케이션디자인과</p>
  </div>

  <div class="box2">
    <h3>WHO AM I?</h3>
    <p>
      안녕하세요. 저는 창의적인 아이디어 구상을 좋아하는 대학생입니다. 새로운 것을 창작하는게 좋아서 디자인을 전공으로 하게 되었습니다. "자유롭게 상상하고 즐기며 하자!"를 모토로 두고 있습니다.
    </p>
  </div>

  <div class="box3">
    <h4>취미</h4>
    <p>
      하우스(House)장르의 노래 듣는 것을 좋아합니다. 경쾌하고 다양한 사운드를 통해 기분 전환을 하는 것을 즐깁니다.
    </p>
  </div>
</body>
</html>
